name: duo-watch

on:
  schedule:
    - cron: "7 * * * *"   # hourly; concurrency keeps one run going and one queued, so coverage is continuous
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Minutes to keep watching (0 = single check)"
        default: "350"

concurrency:
  group: duo-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: duo-state-${{ github.run_id }}
          restore-keys: duo-state-
      - name: Watch Apple HK pickup stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TARGETS: ${{ vars.TARGETS }}
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '350' }}
          STOP_DATE: "2027-01-31"
        run: python3 monitor.py
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: duo-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-log-${{ github.run_id }}
          path: state/log.csv
          retention-days: 30
          if-no-files-found: ignore
