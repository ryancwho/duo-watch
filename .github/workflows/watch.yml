name: duo-watch

on:
  schedule:
    - cron: "*/30 * * * *"   # backup only; GitHub often skips or delays schedules. Each run starts the next itself.
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Minutes to keep watching (0 = single check)"
        default: "340"
      handover_from:
        description: "Internal: run id this run takes over from (leave empty)"
        default: ""

# No concurrency group: each run starts its successor before it ends and checks it really started;
# the successor waits for it to finish. Backup/manual runs stand down if a watcher is already active.

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Git identity for live data pushes
        run: |
          git -C data config user.name "duo-watch bot"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Watch Apple HK pickup stock
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOVER_FROM: ${{ github.event.inputs.handover_from }}
          PUBLISH: "1"
          RING_TARGETS: ${{ vars.RING_TARGETS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_TARGETS: ${{ vars.ALERT_TARGETS }}
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '340' }}
          STOP_DATE: "2027-01-31"
          DATA_DIR: data
        run: python3 monitor.py
      - name: Update report and save data
        if: always() && steps.watch.outputs.skipped != 'true'
        run: |
          PYTHONPATH=. python3 report.py data
          cd data
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "data $(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M') HKT"
          for i in 1 2 3; do git pull -q --rebase origin data && git push -q origin HEAD:data && break; sleep 5; done
      - name: Tell me if the watcher crashed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -fsS -H "Title: Duo watch stopped" -H "Priority: high" -H "Tags: warning" \
            -d "The watcher run failed and did not restart. Open GitHub Actions (duo-watch) and run it again." \
            "https://ntfy.sh/$NTFY_TOPIC" >/dev/null || true
      - name: Hand the check to the watchdog (runs even if this run was cancelled or crashed)
        if: always() && steps.watch.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watchdog.yml --repo "$GITHUB_REPOSITORY" -f from_run="$GITHUB_RUN_ID" || true
