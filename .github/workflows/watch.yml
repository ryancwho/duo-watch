name: duo-watch

on:
  schedule:
    - cron: "*/15 * * * *"   # one run active + one queued at all times -> continuous coverage
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Minutes to keep watching (0 = single check)"
        default: "55"

concurrency:
  group: duo-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Git identity for live data pushes
        run: |
          git -C data config user.name "duo-watch bot"
          git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Watch Apple HK pickup stock
        env:
          PUBLISH: "1"
          RING_TARGETS: ${{ vars.RING_TARGETS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_TARGETS: ${{ vars.ALERT_TARGETS }}
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '55' }}
          STOP_DATE: "2027-01-31"
          DATA_DIR: data
        run: python3 monitor.py
      - name: Update report and save data
        if: always()
        run: |
          PYTHONPATH=. python3 report.py data
          cd data
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "data $(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M') HKT"
          for i in 1 2 3; do git pull -q --rebase origin data && git push -q origin HEAD:data && break; sleep 5; done
