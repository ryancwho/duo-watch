name: probe
on:
  workflow_dispatch:
    inputs:
      depth: { default: "0" }
permissions: { actions: write, contents: read }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - if: github.event.inputs.depth == '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run probe.yml --repo "$GITHUB_REPOSITORY" -f depth=1
      - run: echo "depth ${{ github.event.inputs.depth }}"
