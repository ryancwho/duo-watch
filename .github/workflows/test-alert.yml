name: test-alert

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 1. Channel test (GitHub -> ntfy)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -fsS -H "Title: TEST 1/2: GitHub to ntfy works" -H "Tags: test_tube" \
            -d "Sent from GitHub Actions run ${{ github.run_id }}." "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
      - name: 2. Listener test (Apple HK -> parser -> ntfy)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_POSITIVE: "1"
        run: python3 monitor.py
